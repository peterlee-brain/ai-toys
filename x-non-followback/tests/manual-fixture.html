<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X 未回关面板手工夹具</title>
  <link rel="stylesheet" href="../src/styles.css?v=silent-20260802">
  <style>
    body { margin: 0; color: #0f1419; background: #f7f9f9; font: 15px/1.4 system-ui, sans-serif; }
    main { width: min(600px, 100%); min-height: 100vh; margin: 0 auto; background: white; border-inline: 1px solid #cfd9de; }
    h1 { padding: 18px; margin: 0; border-bottom: 1px solid #cfd9de; }
    [data-testid="UserCell"] { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 16px 18px; border-bottom: 1px solid #eff3f4; }
    .fixture-identity { display: flex; min-width: 0; flex-direction: column; }
    .fixture-identity a { color: inherit; text-decoration: none; }
    .fixture-identity strong,
    .fixture-identity span { display: block; }
    .fixture-handle,
    .fixture-relation { color: #536471; }
    [data-testid="UserCell"] button { flex: 0 0 auto; padding: 7px 14px; color: white; background: #0f1419; border: 1px solid #0f1419; border-radius: 999px; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Following 页面夹具</h1>
    <div data-testid="UserCell">
      <div class="fixture-identity"><a href="/ada"><strong>Ada Lovelace</strong><span class="fixture-handle">@ada</span></a><span class="fixture-relation">Follows you</span></div>
      <button type="button">Following</button>
    </div>
    <div data-testid="UserCell">
      <div class="fixture-identity"><a href="/grace"><strong>Grace Hopper</strong><span class="fixture-handle">@grace</span></a><span class="fixture-relation">关注了你</span></div>
      <button type="button">正在关注</button>
    </div>
    <div data-testid="UserCell">
      <div class="fixture-identity"><a href="/lin"><strong>Lin</strong><span class="fixture-handle">@lin</span></a><span class="fixture-relation">跟隨你</span></div>
      <button type="button">正在跟隨</button>
    </div>
    <div data-testid="UserCell">
      <div class="fixture-identity"><a href="/one_way"><strong>One Way</strong><span class="fixture-handle">@one_way</span></a></div>
      <button type="button">Following</button>
    </div>
    <div data-testid="UserCell">
      <div class="fixture-identity"><a href="/another"><strong>Another</strong><span class="fixture-handle">@another</span></a></div>
      <button type="button">Following</button>
    </div>
  </main>
  <script src="../src/core.js"></script>
  <script src="../src/content.js"></script>
  <script src="../src/panel.js"></script>
  <script>
    const state = {
      updatedAt: Date.now(),
      accounts: {
        ada: { displayName: 'Ada Lovelace', handle: 'ada', profileUrl: 'https://x.com/ada', followsBack: true, seenAt: 1 },
        grace: { displayName: 'Grace Hopper', handle: 'grace', profileUrl: 'https://x.com/grace', followsBack: true, seenAt: 2 },
        lin: { displayName: 'Lin', handle: 'lin', profileUrl: 'https://x.com/lin', followsBack: true, seenAt: 3 },
        one_way: { displayName: 'One Way', handle: 'one_way', profileUrl: 'https://x.com/one_way', followsBack: false, seenAt: 4 },
        another: { displayName: 'Another', handle: 'another', profileUrl: 'https://x.com/another', followsBack: false, seenAt: 5 }
      }
    };
    const controller = XNonFollowbackPanel.mount({
      onToggleEnabled(enabled) {
        controller.render({ ownerHandle: 'fixture_owner', enabled, status: enabled ? '正在扫描' : '扫描已暂停', warning: '', state });
      },
      onClearCurrentOwner() {
        state.accounts = {};
        state.updatedAt = 0;
        controller.render({ ownerHandle: 'fixture_owner', enabled: false, status: '已清空', warning: '', state });
      }
    });
    controller.render({ ownerHandle: 'fixture_owner', enabled: true, status: '正在扫描，请继续向下滚动', warning: '', state });
    for (const cell of document.querySelectorAll('[data-testid="UserCell"]')) {
      const snapshot = XNonFollowbackContent.snapshotFromCell(cell);
      const account = XNonFollowbackCore.parseUserSnapshot(snapshot);
      XNonFollowbackContent.syncFollowingHighlight(cell, account, XNonFollowbackCore);
    }
    const fixturePanel = document.getElementById('x-non-followback-root');
    document.documentElement.dataset.fixturePanelDisplay = getComputedStyle(fixturePanel).display;
    document.documentElement.dataset.fixtureHighlightCount = String(
      document.querySelectorAll('.x-nfb-following-highlight').length
    );
  </script>
</body>
</html>
